<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MowEstimate Pro</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --dark: #1b5e20;
            --bg: #f8f9fa;
            --text: #212529;
            --border: #ced4da;
            --pending: #ff9100;
            --approved: #2979ff;
            --completed: #00e676;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; font-size: 16px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; color: var(--dark); margin-top: 0; text-align: center; border-bottom: 2px solid var(--primary-light); padding-bottom: 10px; }
        h2 { font-size: 1.05rem; color: var(--primary); margin: 15px 0 10px 0; display: flex; align-items: center; justify-content: space-between; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; -webkit-appearance: none; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .row { display: flex; gap: 8px; }
        .col { flex: 1; }
        .config-section { background: var(--primary-light); padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .toggle-btn { background: none; border: none; color: var(--primary); font-weight: bold; cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }
        .result-card { background: #fff3cd; border: 1px solid #ffeba2; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
        .total-row { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 2px dashed #ffc107; font-size: 1.2rem; font-weight: bold; color: #856404; }
        .btn { border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; display: block; width: 100%; text-align: center; margin-top: 8px; }
        .btn-calc { background: var(--primary); color: white; }
        .btn-calc:active { background: var(--dark); }
        .btn-secondary { background: #e0e0e0; color: #333; font-size: 0.9rem; padding: 8px; }
        .client-log { background: #f1f3f4; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .client-item { background: #fff; padding: 8px; border-radius: 6px; margin-bottom: 6px; border-left: 5px solid #ccc; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .client-item.status-pending { border-left-color: var(--pending); }
        .client-item.status-approved { border-left-color: var(--approved); }
        .client-item.status-completed { border-left-color: var(--completed); }
        .status-badge { font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; color: #fff; text-transform: uppercase; }
        .status-pending { background-color: var(--pending); }
        .status-approved { background-color: var(--approved); }
        .status-completed { background-color: var(--completed); }
        .delete-btn { background: none; border: none; color: #d32f2f; font-weight: bold; cursor: pointer; padding-left: 8px; }
        .help-text { font-size: 0.75rem; color: #6c757d; margin-top: 2px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌱 MowEstimate Pro</h1>

    <!-- SETTINGS PANELS -->
    <h2>Settings <button type="button" class="toggle-btn" onclick="toggleSection('configSection')">Show/Hide Rates</button></h2>
    <div class="config-section" id="configSection">
        <div class="form-group">
            <label>Base Rate ($) [Yards &le; 0.25 acre]</label>
            <input type="number" id="baseRate" value="45" oninput="calculateEstimate()">
        </div>
        <div class="form-group">
            <label>Per-Acre Rate ($) [Over 0.25 acre]</label>
            <input type="number" id="perAcreRate" value="60" oninput="calculateEstimate()">
        </div>
        <div class="row">
            <div class="col form-group">
                <label>Structural Reduction (%)</label>
                <input type="number" id="reductionPct" value="25" oninput="calculateEstimate()">
                <div class="help-text">House, driveways, beds</div>
            </div>
            <div class="col form-group">
                <label>Hourly Labor Rate ($)</label>
                <input type="number" id="hourlyRate" value="40" oninput="calculateEstimate()">
            </div>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="form-group">
        <label>Customer Address</label>
        <input type="text" id="address" placeholder="Enter address to simulate parcel lookup" oninput="simulateLookup()">
    </div>

    <div class="row">
        <div class="col form-group">
            <label>Total Lot Size</label>
            <input type="number" id="lotSize" step="0.01" placeholder="e.g. 0.45" oninput="calculateEstimate()">
        </div>
        <div class="col form-group">
            <label>Lot Unit</label>
            <select id="lotUnit" onchange="calculateEstimate()">
                <option value="acres" selected>Acres</option>
                <option value="sqft">Sq. Ft.</option>
            </select>
        </div>
    </div>

    <!-- RECURRING FREQUENCY FEATURE -->
    <div class="switch-container">
        <label style="font-weight: 600;">Enable Frequency Discounts</label>
        <label class="switch">
            <input type="checkbox" id="toggleFrequency" onchange="toggleSectionRow('frequencyRow'); calculateEstimate();">
            <span class="slider"></span>
        </label>
    </div>
    <div class="form-group" id="frequencyRow" style="display:none;">
        <label>Service Frequency</label>
        <select id="frequency" onchange="calculateEstimate()">
            <option value="1.0" selected>One-Time Job (Standard)</option>
            <option value="0.90">Weekly Maintenance (10% Off)</option>
            <option value="0.95">Bi-Weekly Maintenance (5% Off)</option>
        </select>
    </div>

    <!-- OBSTACLE DIFFICULTY FEATURE -->
    <div class="switch-container">
        <label style="font-weight: 600;">Enable Terrain / Obstacle Markups</label>
        <label class="switch">
            <input type="checkbox" id="toggleObstacles" onchange="toggleSectionRow('obstaclesRow'); calculateEstimate();">
            <span class="slider"></span>
        </label>
    </div>
    <div class="form-group" id="obstaclesRow" style="display:none;">
        <label>Terrain Difficulty Factor</label>
        <select id="obstacleFactor" onchange="calculateEstimate()">
            <option value="1.0" selected>Normal (Flat, Clear Access)</option>
            <option value="1.10">Light Obstacles / Slight Slopes (+10%)</option>
            <option value="1.20">Heavy Obstacles / Tight Gates / Steep Slopes (+20%)</option>
        </select>
    </div>

    <!-- WEED EATING ESTIMATOR -->
    <div class="switch-container">
        <label style="font-weight: 600;">Add Weed Eating (Trimming)</label>
        <label class="switch">
            <input type="checkbox" id="toggleWeedEating" onchange="toggleSectionRow('weedEatingSection'); calculateEstimate();">
            <span class="slider"></span>
        </label>
    </div>
    <div id="weedEatingSection" class="config-section">
        <div class="row">
            <div class="col form-group">
                <label>Trimming Perimeter (Linear Ft)</label>
                <input type="number" id="trimPerimeter" value="150" oninput="calculateEstimate()">
            </div>
            <div class="col form-group">
                <label>Trimming Speed (Ft / Min)</label>
                <input type="number" id="trimSpeed" value="25" oninput="calculateEstimate()">
            </div>
        </div>
    </div>

    <!-- HAND WEED PULLING CALCULATOR -->
    <div class="switch-container">
        <label style="font-weight: 600;">Add Hand Weed Pulling</label>
        <label class="switch">
            <input type="checkbox" id="toggleWeeds" onchange="toggleSectionRow('weedingSection'); calculateEstimate();">
            <span class="slider"></span>
        </label>
    </div>
    <div id="weedingSection" class="config-section">
        <div class="form-group">
            <label>Calculation Method</label>
            <select id="weedMethod" onchange="toggleWeedMethod(); calculateEstimate();">
