<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MowEstimate Pro</title>
    <style>
        :root { --primary: #2e7d32; --light: #e8f5e9; --dark: #1b5e20; --bg: #f8f9fa; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); padding: 15px; font-size: 15px; }
        .box { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.3rem; color: var(--dark); text-align: center; border-bottom: 2px solid var(--light); padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 8px; }
        .row { display: flex; gap: 8px; }
        .col { flex: 1; }
        .card { background: #fff3cd; border: 1px solid #ffeba2; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
        .total { font-size: 1.2rem; font-weight: bold; color: #856404; border-top: 2px dashed #ffc107; padding-top: 8px; margin-top: 8px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-copy { background: #e0e0e0; color: #333; margin-top: 8px; }
    </style>
</head>
<body>
<div class="box">
    <h1>🌱 MowEstimate Pro</h1>
    <div class="form-group">
        <label>Customer Address</label>
        <input type="text" id="addr" placeholder="Type address here..." oninput="runApp()">
    </div>
    <div class="row">
        <div class="col form-group">
            <label>Lot Size</label>
            <input type="number" id="size" step="0.01" oninput="runApp()">
        </div>
        <div class="col form-group">
            <label>Unit</label>
            <select id="unit" onchange="runApp()"><option value="ac">Acres</option><option value="ft">Sq. Ft.</option></select>
        </div>
    </div>
    <div class="form-group">
        <label><input type="checkbox" id="trim" onchange="runApp()"> Add Weed Eating (String Trimming)</label>
        <label><input type="checkbox" id="weeds" onchange="runApp()"> Add Hand Weed Pulling (\$40.00 Flat)</label>
        <label style="color:#0d47a1;"><input type="checkbox" id="comp" onchange="runApp()"> Auto Competitor Discount (-5%)</label>
    </div>
    <div class="card" id="result">
        <div id="resAddr" style="font-weight:bold; margin-bottom:6px;"></div>
        <div class="res-row"><span>Mowable Area:</span><span id="resArea" style="font-weight:bold;">-</span></div>
        <div class="res-row"><span>Standard Cut:</span><span id="resMow">-</span></div>
        <div class="res-row" id="rowTrim" style="display:none;"><span>Weed Eating Addon:</span><span>\$20.00</span></div>
        <div class="res-row" id="rowWeed" style="display:none;"><span>Hand Weeding Addon:</span><span>\$40.00</span></div>
        <div class="total res-row"><span>Total Mobile Quote:</span><span id="resTotal">-</span></div>
        <button class="btn btn-copy" onclick="copyQuote()">📋 Copy Text to Clipboard</button>
    </div>
</div>
<script>
    let tot = 0, mowArea = 0, mowCost = 0;
    function runApp() {
        let val = document.getElementById('addr').value.toLowerCase().replace(/[^a-z0-9]/g,'');
        if (val.includes('6310') && val.includes('longview')) {
            document.getElementById('size').value = '0.44';
            document.getElementById('unit').value = 'ac';
        } else if (val.length > 5 && !document.getElementById('size').value) {
            document.getElementById('size').value = '0.25';
        }
        let size = parseFloat(document.getElementById('size').value) || 0;
        if (size <= 0) { document.getElementById('result').style.display = 'none'; return; }
        let isFt = document.getElementById('unit').value === 'ft';
        let acres = isFt ? (size / 43560) : size;
        mowArea = acres * 0.75;
        mowCost = mowArea <= 0.25 ? 45 : 45 + ((mowArea - 0.25) * 60);
        tot = mowCost;
        if (document.getElementById('trim').checked) { tot += 20; document.getElementById('rowTrim').style.display='flex'; } 
        else { document.getElementById('rowTrim').style.display='none'; }
        if (document.getElementById('weeds').checked) { tot += 40; document.getElementById('rowWeed').style.display='flex'; } 
        else { document.getElementById('rowWeed').style.display='none'; }
        if (document.getElementById('comp').checked) tot *= 0.95;
        document.getElementById('resAddr').innerText = "📍 " + (document.getElementById('addr').value || "Target Property");
        document.getElementById('resArea').innerText = mowArea.toFixed(2) + " Acres";
        document.getElementById('resMow').innerText = "\$" + mowCost.toFixed(2);
        document.getElementById('resTotal').innerText = "\$" + tot.toFixed(2);
        document.getElementById('result').style.display = 'block';
    }
    function copyQuote() {
        let a = document.getElementById('addr').value || 'Your Property';
        let m = `Lawn Care Quote:\n📍 Property: ${a}\n📐 Area: ${mowArea.toFixed(2)} ac\n💵 Mowing: $${mowCost.toFixed(2)}`;
        if (document.getElementById('trim').checked) m += `\n✂️ Trimming: $20.00`;
        if (document.getElementById('weeds').checked) m += `\n🌿 Hand Weeding: $40.00`;
        m += `\n💰 Total Quote: $${tot.toFixed(2)}`;
        navigator.clipboard.writeText(m).then(() => alert('Quote copied to your phone clipboard!'));
    }
</script>
</body>
</html>
